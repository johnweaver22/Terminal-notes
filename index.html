<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050805"><title>Terminal Notes</title>
<style>
:root{font-family:"Courier New",monospace;color:#60ff83;background:#050805}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit;background:#091409;border:1px solid #245b32;border-radius:3px;padding:10px}button{cursor:pointer}button:hover,.active{background:#14321b}header{padding:14px 18px;border-bottom:1px solid #245b32;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{letter-spacing:2px}header span,.status{opacity:.65;font-size:12px}main{display:grid;grid-template-columns:300px 1fr;height:calc(100dvh - 65px)}aside{border-right:1px solid #245b32;overflow:auto;padding:14px}#search{width:100%;margin-bottom:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.item{display:block;text-align:left;width:100%;padding:11px;margin:5px 0;overflow-wrap:anywhere}.item small{display:block;opacity:.65;margin-top:5px}.folder{font-weight:bold}.folder.dragover{outline:2px dashed #60ff83;background:#14321b}.group{margin:14px 0 6px;opacity:.6;font-size:12px}.nested{padding-left:15px;border-left:1px solid #245b32;margin-left:8px}section{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}#title{font-size:22px;font-weight:bold;width:100%;border:0;border-bottom:1px solid #245b32}#body{position:relative;z-index:2;flex:1;width:100%;resize:none;line-height:1.65;border:0;outline:none;min-height:150px;color:transparent;caret-color:#60ff83;background:transparent;-webkit-text-fill-color:transparent}#body::selection{background:#245b32}#bodyMirror{position:absolute;inset:0;pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word;overflow:hidden;padding:10px;line-height:1.65;color:#60ff83;font:inherit}.editor{position:relative}.realbullet{display:inline-block;width:1ch;height:1em;position:relative;vertical-align:-.15em}.realbullet:before{content:"";position:absolute;width:.83em;height:.83em;border:1.5px solid currentColor;border-radius:50%;left:0;top:.09em}.realbullet:after{content:"";position:absolute;width:1.5px;height:1.35em;background:currentColor;left:.42em;top:-.18em;transform:rotate(38deg)}.editor{flex:1;display:flex;flex-direction:column;min-height:0}.slashbullet{display:inline-block;width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;position:relative;margin-right:5px;vertical-align:-2px}.slashbullet:after{content:"";position:absolute;width:2px;height:19px;background:currentColor;top:-4px;left:4px;transform:rotate(38deg)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #60ff83}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid #245b32;max-height:34dvh}section{height:64dvh}header{padding:10px}}
</style></head><body><header><strong>▣ TERMINAL NOTES</strong><span>LOCAL FIRST</span></header><main><aside><input id="search" placeholder="Search" aria-label="Search"><div class="toolbar"><button id="newFolder">+ NEW FOLDER</button></div><div class="status" id="count"></div><div id="tree"></div></aside><section><div class="status" id="location"></div><input id="title" placeholder="Untitled note" aria-label="Note title"><div class="toolbar"><button id="bullet"><span class="slashbullet"></span>BULLET</button><button id="table">☐ CHECKLIST</button><button id="delete">DELETE</button><button id="done">DONE</button></div><div class="editor"><div id="bodyMirror" aria-hidden="true"></div><textarea id="body" placeholder="Start typing" aria-label="Note content"></textarea><div id="tables"></div></div><div class="status" id="status">Stored locally on this device</div></section></main>

<script>
const $=id=>document.getElementById(id),key='terminal-notes-v1',folderKey='terminal-notes-folders-v1';
let notes=[],folders=[],selected=null,activeFolder=null;
try{notes=JSON.parse(localStorage.getItem(key)||'[]');folders=JSON.parse(localStorage.getItem(folderKey)||'[]')}catch{}
notes=Array.isArray(notes)?notes:[];folders=Array.isArray(folders)?folders:[];
for(const n of notes){if(!n.created)n.created=n.updated||Date.now();if(!Array.isArray(n.tables))n.tables=[];if(!('folderId' in n))n.folderId=null}
function persist(){localStorage.setItem(key,JSON.stringify(notes));localStorage.setItem(folderKey,JSON.stringify(folders));$('status').textContent='SAVED LOCALLY • '+new Date().toLocaleTimeString()}
function fuzzy(q,s){q=q.toLowerCase().trim();s=s.toLowerCase();if(!q)return true;if(s.includes(q))return true;let i=0;for(const c of s)if(c===q[i])i++;return i===q.length}
function current(){return notes.find(n=>n.id===selected)}
function noteButton(n){const b=document.createElement('button');b.className='item'+(n.id===selected?' active':'');b.draggable=true;b.textContent=n.title||'Untitled note';const sm=document.createElement('small');sm.textContent=new Date(n.created).toLocaleDateString();b.append(sm);b.onclick=()=>select(n.id);b.ondragstart=e=>{e.dataTransfer.setData('text/plain',n.id);e.dataTransfer.effectAllowed='move'};return b}
function render(){const q=$('search').value,matching=notes.filter(n=>fuzzy(q,n.title+' '+n.body)),sorted=matching.sort((a,b)=>b.created-a.created),tree=$('tree');tree.replaceChildren();$('count').textContent=matching.length+' / '+notes.length+' NOTES';const fs=document.createElement('div');fs.className='group';fs.textContent='FOLDERS';tree.append(fs);for(const f of [...folders].sort((a,b)=>a.name.localeCompare(b.name))){const b=document.createElement('button');b.className='item folder'+(activeFolder===f.id?' active':'');b.textContent='▸ '+f.name+' ('+notes.filter(n=>n.folderId===f.id).length+')';b.onclick=()=>{activeFolder=activeFolder===f.id?null:f.id;selected=null;drawEditor();render()};b.ondragover=e=>{e.preventDefault();b.classList.add('dragover')};b.ondragleave=()=>b.classList.remove('dragover');b.ondrop=e=>{e.preventDefault();b.classList.remove('dragover');moveNote(e.dataTransfer.getData('text/plain'),f.id)};tree.append(b);if(activeFolder===f.id){const nest=document.createElement('div');nest.className='nested';for(const n of sorted.filter(n=>n.folderId===f.id))nest.append(noteButton(n));tree.append(nest)}}const label=document.createElement('div');label.className='group';label.textContent='NOTES';tree.append(label);for(const n of sorted.filter(n=>!n.folderId))tree.append(noteButton(n));const root=document.createElement('button');root.className='item';root.textContent='↶ DROP HERE TO MOVE OUT OF FOLDER';root.ondragover=e=>e.preventDefault();root.ondrop=e=>{e.preventDefault();moveNote(e.dataTransfer.getData('text/plain'),null)};tree.append(root)}
function moveNote(id,folderId){const n=notes.find(n=>n.id===id);if(!n)return;n.folderId=folderId;persist();render()}
function drawEditor(){const n=current();$('title').disabled=false;$('body').disabled=false;$('title').value=n?.title||'';$('body').value=n?.body||'';$('location').textContent=n?(folders.find(f=>f.id===n.folderId)?.name||'ALL NOTES'):(activeFolder?(folders.find(f=>f.id===activeFolder)?.name||'FOLDER'):'ALL NOTES');$('tables').replaceChildren();syncMirror()}
function select(id){selected=id;const n=current();if(n&&n.folderId)activeFolder=n.folderId;drawEditor();render()}
function add(){const n={id:crypto.randomUUID(),title:'',body:'',created:Date.now(),updated:Date.now(),folderId:activeFolder,tables:[]};notes.push(n);persist();select(n.id);$('title').focus()}
function update(){syncMirror();if(!current())ensureDraft();const n=current();if(!n)return;n.title=$('title').value;n.body=$('body').value;n.updated=Date.now();persist();render()}
function syncMirror(){const el=$('body'),mirror=$('bodyMirror');mirror.replaceChildren();const parts=el.value.split('⊘');parts.forEach((part,i)=>{if(i){const span=document.createElement('span');span.className='realbullet';mirror.append(span)}mirror.append(document.createTextNode(part))});mirror.scrollTop=el.scrollTop}function insert(text){if(!current())ensureDraft();const el=$('body'),s=el.selectionStart,e=el.selectionEnd;el.setRangeText(text,s,e,'end');el.focus();update()}
function ensureDraft(){if(current())return;const n={id:crypto.randomUUID(),title:'',body:'',created:Date.now(),updated:Date.now(),folderId:activeFolder,tables:[]};notes.push(n);selected=n.id;persist();render()}$('newFolder').onclick=()=>{const name=prompt('Folder name');if(!name?.trim())return;const f={id:crypto.randomUUID(),name:name.trim()};folders.push(f);activeFolder=f.id;selected=null;persist();drawEditor();render()};$('search').oninput=render;$('title').oninput=update;$('body').oninput=update;$('body').onscroll=syncMirror;
$('bullet').onclick=()=>insert('⊘ ');$('table').onclick=()=>{const el=$('body');const pos=el.selectionStart;const start=el.value.lastIndexOf('\n',Math.max(0,pos-1))+1;const lineEnd=el.value.indexOf('\n',pos);const end=lineEnd<0?el.value.length:lineEnd;const line=el.value.slice(start,end);if(!/^[☐☑] /.test(line)){el.setRangeText('☐ ',start,start,'preserve');el.setSelectionRange(pos+2,pos+2);el.focus();update()}else el.focus()};
$('body').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey)return;const el=e.target,pos=el.selectionStart,start=el.value.lastIndexOf('\n',Math.max(0,pos-1))+1;const line=el.value.slice(start,pos);if(!/^[☐☑] /.test(line))return;e.preventDefault();if(line.trim()==='☐'||line.trim()==='☑'){el.setRangeText('',start,pos,'end');update();return}el.setRangeText('\n☐ ',pos,el.selectionEnd,'end');update()});
$('body').addEventListener('click',e=>{const el=e.target,pos=el.selectionStart,start=el.value.lastIndexOf('\n',Math.max(0,pos-1))+1;const mark=el.value.slice(start,start+2);if(mark!=='☐ '&&mark!=='☑ ')return;const rect=el.getBoundingClientRect();const style=getComputedStyle(el);const x=e.clientX-rect.left-parseFloat(style.paddingLeft);if(x>24)return;el.setRangeText(mark==='☐ '?'☑':'☐',start,start+1,'preserve');update()});

$('delete').onclick=()=>{if(!current()){ $('title').value='';$('body').value='';return }if(!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==selected);selected=null;persist();drawEditor();render()};$('done').onclick=()=>{if(!current()&&($('title').value.trim()||$('body').value.trim()))update();selected=null;persist();drawEditor();render();$('body').focus()};
selected=null;drawEditor();render();
</script></body></html>
