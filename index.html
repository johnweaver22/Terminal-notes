<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050805"><title>Terminal Notes</title>
<style>
:root{font-family:"Courier New",monospace;color:#60ff83;background:#050805}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit;background:#091409;border:1px solid #245b32;border-radius:3px;padding:10px}button{cursor:pointer}@media(hover:hover){button:hover{background:#14321b}}.active{background:#14321b}header{padding:14px 18px;border-bottom:1px solid #245b32;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{letter-spacing:2px}header span,.status{opacity:.65;font-size:12px}main{display:block;height:calc(100dvh - 65px)}main aside{height:100%;width:100%;border-right:0;overflow:auto}main section{display:none;height:100%;width:100%}main.editing aside{display:none}main.editing section{display:flex}aside{border-right:1px solid #245b32;overflow:auto;padding:14px}#search{width:100%;margin-bottom:10px}.searchbox{position:relative}.searchpopup{position:absolute;z-index:30;top:100%;left:0;right:0;background:#071007;border:1px solid #39854b;box-shadow:0 12px 24px #000;max-height:48dvh;overflow-y:auto;padding:5px}.searchpopup[hidden]{display:none}.searchpopup button{width:100%;text-align:left;display:block;border:0;border-bottom:1px solid #245b32;border-radius:0;padding:10px}.searchpopup small{display:block;opacity:.7;font-size:11px;margin-top:4px}.searchpopup .empty{padding:10px;font-size:12px;opacity:.7}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.createbuttons{display:flex;flex-wrap:nowrap;width:100%}.createbuttons button{flex:1 1 0;min-width:0}.edittools{flex-wrap:nowrap;gap:5px}.edittools button{flex:1 1 0;min-width:0;white-space:nowrap;padding:9px 3px;font-size:clamp(10px,1.8vw,14px)}.edittools .trianglebullet{margin-right:3px}.item{display:block;text-align:left;width:100%;padding:11px;margin:5px 0;overflow-wrap:anywhere}.item small{display:block;opacity:.65;margin-top:5px}.folder{font-weight:bold}.folder.open{border-color:#60ff83}.item:focus:not(:focus-visible){outline:none}.foldermenu{position:fixed;z-index:50;background:#071007;border:1px solid #60ff83;padding:6px;box-shadow:0 8px 24px #000}.foldermenu button{width:100%;white-space:nowrap}.folder.dragover{outline:2px dashed #60ff83;background:#14321b}.group{margin:14px 0 6px;opacity:.6;font-size:12px}.rootnotes{min-height:140px;padding-bottom:45px;border:1px solid transparent}.rootnotes.dragover{border:1px dashed #60ff83;background:#102417}.nested{padding-left:15px;border-left:1px solid #245b32;margin-left:8px}section{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}#title{font-size:22px;font-weight:bold;width:100%;border:0;border-bottom:1px solid #245b32}#body{position:relative;z-index:2;flex:1;width:100%;resize:none;line-height:1.65;border:0;outline:none;min-height:150px;background:transparent;color:transparent;caret-color:#60ff83;-webkit-text-fill-color:transparent}#body::selection{background:#275d39}#bodymirror{position:absolute;inset:0;overflow:hidden;pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;font:inherit;line-height:1.65;padding:10px;color:#60ff83;z-index:1}#bodymirror .inline-triangle{display:inline-block;width:1.4ch;height:1.35em;vertical-align:-.24em;position:relative}#bodymirror .inline-triangle svg{width:100%;height:100%;display:block}.editor{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}.trianglebullet{display:inline-block;width:12px;height:12px;position:relative;background:currentColor;clip-path:polygon(50% 0%,100% 86.6%,0% 86.6%,50% 0%,50% 24%,20% 76%,80% 76%,50% 24%);vertical-align:-1px;margin-right:4px}.brandbullet{width:14px;height:14px;margin-right:7px;vertical-align:-2px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #60ff83}@media(max-width:700px){main{height:calc(100dvh - 54px)}main aside{max-height:none;border-bottom:0}main section{height:100%}header{padding:10px}}
</style></head><body><header><strong><span class="trianglebullet brandbullet" aria-hidden="true"></span> TERMINAL NOTES</strong></header><main><aside><div class="searchbox"><input id="search" placeholder="Search" aria-label="Search" autocomplete="off"><div id="searchpopup" class="searchpopup" hidden></div></div><div class="toolbar createbuttons"><button id="new">+ NEW NOTE</button><button id="newFolder">+ NEW FOLDER</button></div><div id="tree"></div></aside><section><div class="status" id="location"></div><input id="title" placeholder="Untitled note" aria-label="Note title"><div class="toolbar edittools"><button id="bullet"><span class="trianglebullet"></span>BULLET</button><button id="table">☐ CHECKLIST</button><button id="delete">DELETE</button><button id="done">DONE</button></div><div class="editor"><div id="bodymirror" aria-hidden="true"></div><textarea id="body" placeholder="Start typing" aria-label="Note content"></textarea><div id="tables"></div></div><div class="status" id="status">Stored locally on this device</div></section></main>

<script>
const $=id=>document.getElementById(id),key='terminal-notes-v1',folderKey='terminal-notes-folders-v1';
let notes=[],folders=[],selected=null,activeFolder=null;const expandedFolders=new Set();
try{notes=JSON.parse(localStorage.getItem(key)||'[]');folders=JSON.parse(localStorage.getItem(folderKey)||'[]')}catch{}
notes=Array.isArray(notes)?notes:[];folders=Array.isArray(folders)?folders:[];
for(const n of notes){if(!n.created)n.created=n.updated||Date.now();if(!Array.isArray(n.tables))n.tables=[];if(!('folderId' in n))n.folderId=null}
function persist(){localStorage.setItem(key,JSON.stringify(notes));localStorage.setItem(folderKey,JSON.stringify(folders));$('status').textContent='SAVED LOCALLY • '+new Date().toLocaleTimeString()}
function fuzzy(q,s){const norm=v=>v.toLowerCase().normalize('NFKD').replace(/[\\u0300-\\u036f]/g,'');q=norm(q.trim());s=norm(s);if(!q)return true;if(s.includes(q))return true;const words=s.split(/[^a-z0-9]+/).filter(Boolean);const distance=(a,b)=>{let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=next}return prev[b.length]};return q.split(/\\s+/).every(term=>words.some(w=>{if(w.startsWith(term))return true;let k=0;for(const ch of w)if(ch===term[k])k++;return k===term.length||(term.length>=3&&Math.abs(w.length-term.length)<=2&&distance(term,w)<=Math.max(1,Math.floor(term.length/4)))}))}
function current(){return notes.find(n=>n.id===selected)}
function noteButton(n){const b=document.createElement('button');b.type='button';b.className='item'+(n.id===selected?' active':'');b.setAttribute('aria-pressed',String(n.id===selected));b.draggable=true;b.textContent=n.title||'Untitled note';const sm=document.createElement('small');sm.textContent=new Date(n.created).toLocaleDateString();b.append(sm);let held=false,holdTimer,startX=0,startY=0;const askDelete=()=>{clearTimeout(holdTimer);held=true;document.querySelector('.notemenu')?.remove();const menu=document.createElement('div');menu.className='foldermenu notemenu';const del=document.createElement('button');del.type='button';del.textContent='DELETE NOTE';del.onclick=()=>{menu.remove();notes=notes.filter(x=>x.id!==n.id);if(selected===n.id)selected=null;persist();render()};menu.append(del);document.body.append(menu);const rect=b.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(rect.left,innerWidth-menu.offsetWidth-8))+'px';menu.style.top=Math.max(8,Math.min(rect.bottom,innerHeight-menu.offsetHeight-8))+'px';setTimeout(()=>document.addEventListener('pointerdown',function close(ev){if(!menu.contains(ev.target)){menu.remove();document.removeEventListener('pointerdown',close)}},true),0)};b.addEventListener('contextmenu',e=>{e.preventDefault();if(!held)askDelete()});b.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'&&e.pointerType!=='pen')return;held=false;startX=e.clientX;startY=e.clientY;clearTimeout(holdTimer);b.draggable=false;holdTimer=setTimeout(askDelete,550)});b.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12){clearTimeout(holdTimer);b.draggable=true}});for(const eventName of ['pointerup','pointercancel','dragstart'])b.addEventListener(eventName,()=>{clearTimeout(holdTimer);setTimeout(()=>{b.draggable=true},0)});b.onclick=e=>{if(held){e.preventDefault();held=false;return}select(n.id)};b.ondragstart=e=>{clearTimeout(holdTimer);e.dataTransfer.setData('text/plain',n.id);e.dataTransfer.effectAllowed='move'};return b}

function render(){const q=$('search').value.trim(),sorted=[...notes].sort((a,b)=>b.created-a.created),tree=$('tree');tree.replaceChildren();const fs=document.createElement('div');fs.className='group';fs.textContent='FOLDERS';tree.append(fs);for(const f of [...folders].sort((a,b)=>a.name.localeCompare(b.name))){const btn=document.createElement('button');btn.className='item folder'+(expandedFolders.has(f.id)?' open':'');btn.setAttribute('aria-expanded',String(expandedFolders.has(f.id)));btn.textContent=(expandedFolders.has(f.id)?'▾ ':'▸ ')+f.name+' ('+notes.filter(n=>n.folderId===f.id).length+')';let holdTimer,held=false;const deleteFolder=()=>{if(!confirm('Delete folder "'+f.name+'" and ALL notes inside it? This cannot be undone. Move any notes you want to keep out of the folder first.'))return;notes=notes.filter(n=>n.folderId!==f.id);if(!notes.some(n=>n.id===selected))selected=null;folders=folders.filter(x=>x.id!==f.id);expandedFolders.delete(f.id);if(activeFolder===f.id)activeFolder=null;persist();render()};const menu=e=>{e.preventDefault();held=true;const existing=document.querySelector('.foldermenu');existing?.remove();const popup=document.createElement('div');popup.className='foldermenu';const rename=document.createElement('button');rename.textContent='RENAME FOLDER';rename.onclick=()=>{popup.remove();const name=prompt('Rename folder',f.name);if(name===null||!name.trim())return;f.name=name.trim();persist();render()};popup.append(rename);const del=document.createElement('button');del.textContent='DELETE FOLDER';del.onclick=()=>{popup.remove();deleteFolder()};popup.append(del);document.body.append(popup);const box=btn.getBoundingClientRect();popup.style.left=Math.max(8,Math.min(box.left,innerWidth-popup.offsetWidth-8))+'px';popup.style.top=Math.max(8,Math.min(box.bottom,innerHeight-popup.offsetHeight-8))+'px';setTimeout(()=>document.addEventListener('pointerdown',function close(ev){if(!popup.contains(ev.target)){popup.remove();document.removeEventListener('pointerdown',close)}},true),0)};btn.addEventListener('contextmenu',menu);btn.addEventListener('touchstart',()=>{held=false;holdTimer=setTimeout(()=>menu({preventDefault(){}}),600)},{passive:true});for(const eventName of ['touchend','touchcancel','touchmove'])btn.addEventListener(eventName,()=>clearTimeout(holdTimer));btn.onclick=()=>{if(held){held=false;return}if(expandedFolders.has(f.id)){expandedFolders.delete(f.id);if(activeFolder===f.id)activeFolder=null}else{expandedFolders.add(f.id);activeFolder=f.id}selected=null;drawEditor();render()};btn.ondragover=e=>{e.preventDefault();btn.classList.add('dragover')};btn.ondragleave=()=>btn.classList.remove('dragover');btn.ondrop=e=>{e.preventDefault();btn.classList.remove('dragover');moveNote(e.dataTransfer.getData('text/plain'),f.id)};tree.append(btn);if(expandedFolders.has(f.id)){const nest=document.createElement('div');nest.className='nested';for(const n of sorted.filter(n=>n.folderId===f.id))nest.append(noteButton(n));tree.append(nest)}}const label=document.createElement('div');label.className='group';label.textContent='NOTES';const root=document.createElement('div');root.className='rootnotes';root.ondragover=e=>{e.preventDefault();root.classList.add('dragover')};root.ondragleave=e=>{if(!root.contains(e.relatedTarget))root.classList.remove('dragover')};root.ondrop=e=>{e.preventDefault();e.stopPropagation();root.classList.remove('dragover');moveNote(e.dataTransfer.getData('text/plain'),null)};root.append(label);for(const n of sorted.filter(n=>!n.folderId))root.append(noteButton(n));tree.append(root);renderSearch()}
function searchMatches(){const q=$('search').value.trim();if(!q)return [];const norm=v=>String(v||'').toLowerCase().normalize('NFKD');const term=norm(q);const boundary=c=>!c||!/[a-z0-9]/i.test(c);const exact=v=>{let pos=v.indexOf(term);while(pos!==-1){if(boundary(v[pos-1])&&boundary(v[pos+term.length]))return true;pos=v.indexOf(term,pos+1)}return false};const ranked=[];for(const n of notes){const folder=folders.find(f=>f.id===n.folderId);const fields=[n.title||'',n.body||'',folder?.name||''].map(norm);let rank=99;if(fields.some(exact))rank=0;else if(fields.some(v=>v.includes(term)))rank=1;else if(fields.some(v=>fuzzy(q,v)))rank=2;if(rank<99)ranked.push({n,rank})}ranked.sort((a,b)=>a.rank-b.rank||b.n.created-a.n.created);return ranked.map(x=>x.n)}

function renderSearch(){const pop=$('searchpopup'),q=$('search').value.trim();pop.replaceChildren();pop.hidden=!q;if(!q)return;const matches=searchMatches();if(!matches.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='NO MATCHING NOTES';pop.append(empty);return}for(const n of matches.slice(0,30)){const btn=document.createElement('button');btn.type='button';btn.textContent=n.title||'Untitled note';const context=document.createElement('small');const folder=folders.find(f=>f.id===n.folderId);context.textContent=(folder?folder.name+' • ':'')+(n.body||'').replace(/\\s+/g,' ').slice(0,100);btn.append(context);btn.onclick=()=>{select(n.id);$('search').value='';pop.hidden=true;render()};pop.append(btn)}}

function moveNote(id,folderId){const n=notes.find(n=>n.id===id);if(!n)return;n.folderId=folderId;persist();render()}
function syncNoteMirror(){const el=$('body'),mirror=$('bodymirror');if(!mirror)return;mirror.replaceChildren();const content=el.value;const chunks=content.split('△');for(let i=0;i<chunks.length;i++){if(i){const mark=document.createElement('span');mark.className='inline-triangle';mark.innerHTML='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 L18 16 H2 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';mirror.append(mark)}mirror.append(document.createTextNode(chunks[i]))}mirror.scrollTop=el.scrollTop;mirror.scrollLeft=el.scrollLeft}
function drawEditor(){const n=current();$('title').disabled=false;$('body').disabled=false;$('title').value=n?.title||'';$('body').value=n?.body||'';$('location').textContent=n?(folders.find(f=>f.id===n.folderId)?.name||'ALL NOTES'):(activeFolder?(folders.find(f=>f.id===activeFolder)?.name||'FOLDER'):'ALL NOTES');$('tables').replaceChildren();syncNoteMirror()}
function showEditor(){document.querySelector('main').classList.add('editing')}function showHome(){document.querySelector('main').classList.remove('editing');selected=null;drawEditor();render()}function select(id){selected=id;const n=current();if(n&&n.folderId){activeFolder=n.folderId;expandedFolders.add(n.folderId)}drawEditor();render();showEditor()}
function add(){const n={id:crypto.randomUUID(),title:'',body:'',created:Date.now(),updated:Date.now(),folderId:activeFolder,tables:[]};notes.push(n);persist();select(n.id);$('title').focus()}
function update(){if(!current())ensureDraft();const n=current();if(!n)return;n.title=$('title').value;n.body=$('body').value;n.updated=Date.now();persist();render();syncNoteMirror()}
function insert(text){if(!current())ensureDraft();const el=$('body'),s=el.selectionStart,e=el.selectionEnd;el.setRangeText(text,s,e,'end');el.focus();update()}
$('new').onclick=add;function ensureDraft(){if(current())return;const n={id:crypto.randomUUID(),title:'',body:'',created:Date.now(),updated:Date.now(),folderId:activeFolder,tables:[]};notes.push(n);selected=n.id;persist();render()}$('newFolder').onclick=()=>{const name=prompt('Folder name');if(!name?.trim())return;const f={id:crypto.randomUUID(),name:name.trim()};folders.push(f);activeFolder=f.id;expandedFolders.add(f.id);selected=null;persist();drawEditor();render()};$('search').oninput=renderSearch;$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const first=$('searchpopup').querySelector('button');if(first)first.click()}if(e.key==='Escape')$('searchpopup').hidden=true};document.addEventListener('pointerdown',e=>{if(!e.target.closest('.searchbox'))$('searchpopup').hidden=true});$('search').onfocus=renderSearch;$('title').oninput=update;$('body').oninput=update;$('body').addEventListener('scroll',syncNoteMirror);
$('bullet').onclick=()=>insert('△ ');$('table').onclick=()=>{const el=$('body');const pos=el.selectionStart;const start=el.value.lastIndexOf('\n',Math.max(0,pos-1))+1;const lineEnd=el.value.indexOf('\n',pos);const end=lineEnd<0?el.value.length:lineEnd;const line=el.value.slice(start,end);if(!/^[☐☑] /.test(line)){el.setRangeText('☐ ',start,start,'preserve');el.setSelectionRange(pos+2,pos+2);el.focus();update()}else el.focus()};
$('body').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey)return;const el=e.target,pos=el.selectionStart,start=el.value.lastIndexOf('\n',Math.max(0,pos-1))+1;const line=el.value.slice(start,pos);if(!/^[☐☑] /.test(line))return;e.preventDefault();if(line.trim()==='☐'||line.trim()==='☑'){el.setRangeText('',start,pos,'end');update();return}el.setRangeText('\n☐ ',pos,el.selectionEnd,'end');update()});
$('body').addEventListener('click',e=>{const el=e.target,pos=el.selectionStart,start=el.value.lastIndexOf('\n',Math.max(0,pos-1))+1;const mark=el.value.slice(start,start+2);if(mark!=='☐ '&&mark!=='☑ ')return;const rect=el.getBoundingClientRect();const style=getComputedStyle(el);const x=e.clientX-rect.left-parseFloat(style.paddingLeft);if(x>24)return;el.setRangeText(mark==='☐ '?'☑':'☐',start,start+1,'preserve');update()});

$('delete').onclick=()=>{if(!current()){ $('title').value='';$('body').value='';return }if(!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==selected);selected=null;persist();showHome()};$('done').onclick=()=>{if(!current()&&($('title').value.trim()||$('body').value.trim()))update();selected=null;persist();showHome()};
selected=null;drawEditor();render();
</script></body></html>
