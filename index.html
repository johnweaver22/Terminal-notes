<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050805"><title>Terminal Notes</title>
<style>
:root{font-family:"Courier New",monospace;color:#60ff83;background:#050805}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit;background:#091409;border:1px solid #245b32;border-radius:3px;padding:10px}button{cursor:pointer}button:hover,.active{background:#14321b}header{padding:14px 18px;border-bottom:1px solid #245b32;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{letter-spacing:2px}header span,.status{opacity:.65;font-size:12px}main{display:grid;grid-template-columns:300px 1fr;height:calc(100dvh - 65px)}aside{border-right:1px solid #245b32;overflow:auto;padding:14px}#search{width:100%;margin-bottom:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.item{display:block;text-align:left;width:100%;padding:11px;margin:5px 0;overflow-wrap:anywhere}.item small{display:block;opacity:.65;margin-top:5px}.folder{font-weight:bold}.folder.dragover{outline:2px dashed #60ff83;background:#14321b}.group{margin:14px 0 6px;opacity:.6;font-size:12px}.nested{padding-left:15px;border-left:1px solid #245b32;margin-left:8px}section{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}#title{font-size:22px;font-weight:bold;width:100%;border:0;border-bottom:1px solid #245b32}#body{flex:1;width:100%;resize:none;line-height:1.65;border:0;outline:none;min-height:150px}.editor{flex:1;display:flex;flex-direction:column;min-height:0}.tablewrap{overflow:auto;max-height:40dvh;border:1px solid #245b32;margin:6px 0}.tablewrap table{border-collapse:collapse;table-layout:fixed;min-width:100%;width:max-content}.tablewrap td{border:1px solid #39854b;min-width:120px;padding:0}.tablewrap td textarea{display:block;border:0;border-radius:0;width:100%;min-width:120px;min-height:42px;background:transparent;padding:9px;resize:vertical;line-height:1.4}.cellmenu{position:fixed;z-index:10;background:#071007;border:1px solid #60ff83;padding:12px;box-shadow:0 8px 30px #000;max-width:95vw}.cellmenu .cross{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cellmenu button{padding:8px;font-size:12px}.cellmenu .center{display:grid;place-items:center}.cellmenu .remove{display:flex;gap:6px;margin-top:9px}.tabletools{display:flex;justify-content:space-between;align-items:center;gap:8px}.tabletools button{padding:5px}dialog{background:#071007;color:#60ff83;border:1px solid #39854b;max-width:95vw}dialog form{display:grid;gap:12px}dialog label{display:grid;gap:5px}.slashbullet{display:inline-block;width:13px;height:13px;border:1.5px solid currentColor;border-radius:50%;position:relative;margin-right:5px;vertical-align:-2px}.slashbullet:after{content:"";position:absolute;width:2px;height:19px;background:currentColor;top:-4px;left:4px;transform:rotate(38deg)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #60ff83}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid #245b32;max-height:34dvh}section{height:64dvh}header{padding:10px}}
</style></head><body><header><strong>▣ TERMINAL NOTES</strong><span>LOCAL FIRST</span></header><main><aside><input id="search" placeholder="Search" aria-label="Search"><div class="toolbar"><button id="newFolder">+ NEW FOLDER</button></div><div class="status" id="count"></div><div id="tree"></div></aside><section><div class="status" id="location"></div><input id="title" placeholder="Untitled note" aria-label="Note title"><div class="toolbar"><button id="bullet"><span class="slashbullet"></span>BULLET</button><button id="table">▦ TABLE</button><button id="delete">DELETE</button><button id="done">DONE</button></div><div class="editor"><textarea id="body" placeholder="Start typing" aria-label="Note content"></textarea><div id="tables"></div></div><div class="status" id="status">Stored locally on this device</div></section></main>
<dialog id="tableDialog"><form method="dialog" id="tableForm"><strong>CREATE TABLE</strong><label>Columns<input id="cols" type="number" min="1" max="12" value="3" required></label><label>Rows<input id="rows" type="number" min="1" max="30" value="3" required></label><div class="toolbar"><button type="button" id="cancelTable">CANCEL</button><button type="submit">CREATE</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),key='terminal-notes-v1',folderKey='terminal-notes-folders-v1';
let notes=[],folders=[],selected=null,activeFolder=null;
try{notes=JSON.parse(localStorage.getItem(key)||'[]');folders=JSON.parse(localStorage.getItem(folderKey)||'[]')}catch{}
notes=Array.isArray(notes)?notes:[];folders=Array.isArray(folders)?folders:[];
for(const n of notes){if(!n.created)n.created=n.updated||Date.now();if(!Array.isArray(n.tables))n.tables=[];if(!('folderId' in n))n.folderId=null}
function persist(){localStorage.setItem(key,JSON.stringify(notes));localStorage.setItem(folderKey,JSON.stringify(folders));$('status').textContent='SAVED LOCALLY • '+new Date().toLocaleTimeString()}
function fuzzy(q,s){q=q.toLowerCase().trim();s=s.toLowerCase();if(!q)return true;if(s.includes(q))return true;let i=0;for(const c of s)if(c===q[i])i++;return i===q.length}
function current(){return notes.find(n=>n.id===selected)}
function noteButton(n){const b=document.createElement('button');b.className='item'+(n.id===selected?' active':'');b.draggable=true;b.textContent=n.title||'Untitled note';const sm=document.createElement('small');sm.textContent=new Date(n.created).toLocaleDateString();b.append(sm);b.onclick=()=>select(n.id);b.ondragstart=e=>{e.dataTransfer.setData('text/plain',n.id);e.dataTransfer.effectAllowed='move'};return b}
function render(){const q=$('search').value,matching=notes.filter(n=>fuzzy(q,n.title+' '+n.body+' '+JSON.stringify(n.tables||[]))),sorted=matching.sort((a,b)=>b.created-a.created),tree=$('tree');tree.replaceChildren();$('count').textContent=matching.length+' / '+notes.length+' NOTES';const fs=document.createElement('div');fs.className='group';fs.textContent='FOLDERS';tree.append(fs);for(const f of [...folders].sort((a,b)=>a.name.localeCompare(b.name))){const b=document.createElement('button');b.className='item folder'+(activeFolder===f.id?' active':'');b.textContent='▸ '+f.name+' ('+notes.filter(n=>n.folderId===f.id).length+')';b.onclick=()=>{activeFolder=activeFolder===f.id?null:f.id;selected=null;drawEditor();render()};b.ondragover=e=>{e.preventDefault();b.classList.add('dragover')};b.ondragleave=()=>b.classList.remove('dragover');b.ondrop=e=>{e.preventDefault();b.classList.remove('dragover');moveNote(e.dataTransfer.getData('text/plain'),f.id)};tree.append(b);if(activeFolder===f.id){const nest=document.createElement('div');nest.className='nested';for(const n of sorted.filter(n=>n.folderId===f.id))nest.append(noteButton(n));tree.append(nest)}}const label=document.createElement('div');label.className='group';label.textContent='NOTES';tree.append(label);for(const n of sorted.filter(n=>!n.folderId))tree.append(noteButton(n));const root=document.createElement('button');root.className='item';root.textContent='↶ DROP HERE TO MOVE OUT OF FOLDER';root.ondragover=e=>e.preventDefault();root.ondrop=e=>{e.preventDefault();moveNote(e.dataTransfer.getData('text/plain'),null)};tree.append(root)}
function moveNote(id,folderId){const n=notes.find(n=>n.id===id);if(!n)return;n.folderId=folderId;persist();render()}
function drawEditor(){const n=current();$('title').disabled=false;$('body').disabled=false;$('title').value=n?.title||'';$('body').value=n?.body||'';$('location').textContent=n?(folders.find(f=>f.id===n.folderId)?.name||'ALL NOTES'):(activeFolder?(folders.find(f=>f.id===activeFolder)?.name||'FOLDER') :'ALL NOTES');$('tables').replaceChildren();if(!n)return;for(const t of n.tables){const wrap=document.createElement('div');wrap.className='tablewrap';const table=document.createElement('table');const tbody=document.createElement('tbody');t.cells.forEach((row,r)=>{const tr=document.createElement('tr');row.forEach((value,c)=>{const td=document.createElement('td'),inp=document.createElement('textarea');inp.rows=1;inp.value=value;inp.setAttribute('aria-label','Row '+(r+1)+' column '+(c+1));inp.oninput=()=>{t.cells[r][c]=inp.value;n.updated=Date.now();persist();inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'};inp.onkeydown=e=>{if(e.key==='Enter')e.stopPropagation()};let timer;const show=e=>{e.preventDefault();openCellMenu(t,r,c,td)};td.addEventListener('contextmenu',show);td.addEventListener('touchstart',()=>{timer=setTimeout(()=>openCellMenu(t,r,c,td),550)},{passive:true});for(const ev of ['touchend','touchmove','touchcancel'])td.addEventListener(ev,()=>clearTimeout(timer));td.append(inp);tr.append(td)});tbody.append(tr)});table.append(tbody);wrap.append(table);const tools=document.createElement('div');tools.className='tabletools';const lbl=document.createElement('small');lbl.textContent=t.cells.length+' ROWS × '+(t.cells[0]?.length||0)+' COLUMNS';const del=document.createElement('button');del.textContent='REMOVE TABLE';del.onclick=()=>{if(!confirm('Remove this table?'))return;n.tables=n.tables.filter(x=>x!==t);persist();drawEditor()};tools.append(lbl,del);$('tables').append(tools,wrap)}}
function openCellMenu(t,r,c,anchor){document.querySelector('.cellmenu')?.remove();const menu=document.createElement('div');menu.className='cellmenu';const cross=document.createElement('div');cross.className='cross';const add=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();persist();menu.remove();drawEditor()};return b};const width=t.cells[0].length;cross.append(document.createElement('span'),add('↑ ROW',()=>t.cells.splice(r,0,Array(width).fill(''))),document.createElement('span'),add('← COL',()=>t.cells.forEach(row=>row.splice(c,0,''))),Object.assign(document.createElement('span'),{textContent:'▦',className:'center'}),add('COL →',()=>t.cells.forEach(row=>row.splice(c+1,0,''))),document.createElement('span'),add('↓ ROW',()=>t.cells.splice(r+1,0,Array(width).fill(''))));const remove=document.createElement('div');remove.className='remove';remove.append(add('− ROW',()=>{if(t.cells.length>1)t.cells.splice(r,1)}),add('− COL',()=>{if(width>1)t.cells.forEach(row=>row.splice(c,1))}),add('CLOSE',()=>{}));menu.append(cross,remove);document.body.append(menu);const rect=anchor.getBoundingClientRect();menu.style.left=Math.max(5,Math.min(rect.left,innerWidth-menu.offsetWidth-5))+'px';menu.style.top=Math.max(5,Math.min(rect.bottom+4,innerHeight-menu.offsetHeight-5))+'px';setTimeout(()=>document.addEventListener('pointerdown',function outside(e){if(!menu.contains(e.target)){menu.remove();document.removeEventListener('pointerdown',outside)}},true),0)}
function select(id){selected=id;const n=current();if(n&&n.folderId)activeFolder=n.folderId;drawEditor();render()}
function add(){const n={id:crypto.randomUUID(),title:'',body:'',created:Date.now(),updated:Date.now(),folderId:activeFolder,tables:[]};notes.push(n);persist();select(n.id);$('title').focus()}
function update(){if(!current())ensureDraft();const n=current();if(!n)return;n.title=$('title').value;n.body=$('body').value;n.updated=Date.now();persist();render()}
function insert(text){if(!current())ensureDraft();const el=$('body'),s=el.selectionStart,e=el.selectionEnd;el.setRangeText(text,s,e,'end');el.focus();update()}
function ensureDraft(){if(current())return;const n={id:crypto.randomUUID(),title:'',body:'',created:Date.now(),updated:Date.now(),folderId:activeFolder,tables:[]};notes.push(n);selected=n.id;persist();render()}$('newFolder').onclick=()=>{const name=prompt('Folder name');if(!name?.trim())return;const f={id:crypto.randomUUID(),name:name.trim()};folders.push(f);activeFolder=f.id;selected=null;persist();drawEditor();render()};$('search').oninput=render;$('title').oninput=update;$('body').oninput=update;
$('bullet').onclick=()=>insert('⊘ ');$('table').onclick=()=>{{if(!current())ensureDraft();$('tableDialog').showModal()}};$('cancelTable').onclick=()=>$('tableDialog').close();$('tableForm').onsubmit=e=>{e.preventDefault();const n=current();if(!n)return;const c=Math.max(1,Math.min(12,Number($('cols').value)||3)),r=Math.max(1,Math.min(30,Number($('rows').value)||3));n.tables.push({id:crypto.randomUUID(),cells:Array.from({length:r},()=>Array(c).fill(''))});persist();$('tableDialog').close();drawEditor()};
$('delete').onclick=()=>{if(!current()){ $('title').value='';$('body').value='';return }if(!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==selected);selected=null;persist();drawEditor();render()};$('done').onclick=()=>{if(!current()&&($('title').value.trim()||$('body').value.trim()))update();selected=null;persist();drawEditor();render();$('body').focus()};
selected=null;drawEditor();render();
</script></body></html>
