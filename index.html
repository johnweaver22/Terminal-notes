<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050805"><title>Terminal Notes</title>
<style>
:root{font-family:"Courier New",monospace;color:#60ff83;background:#050805}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit;background:#091409;border:1px solid #245b32;border-radius:3px;padding:10px}button{cursor:pointer}button:hover,.active{background:#14321b}header{padding:14px 18px;border-bottom:1px solid #245b32;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{letter-spacing:2px}header span{opacity:.65;font-size:12px}main{display:grid;grid-template-columns:300px 1fr;height:calc(100dvh - 65px)}aside{border-right:1px solid #245b32;overflow:auto;padding:14px}#search{width:100%;margin-bottom:10px}#notes{display:grid;gap:6px}.note{padding:12px;text-align:left;width:100%;overflow:hidden}.note small{display:block;opacity:.6;margin-top:6px}section{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}#title{font-size:22px;font-weight:bold;width:100%;border:0;border-bottom:1px solid #245b32}#body{flex:1;width:100%;resize:none;line-height:1.65;border:0;outline:none;min-height:220px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:12px;opacity:.65}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #60ff83}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid #245b32;max-height:32dvh}section{height:65dvh}header{padding:10px}}
</style></head><body><header><strong>▣ TERMINAL NOTES</strong><span>v0.1 // LOCAL FIRST</span></header><main><aside><input id="search" placeholder="> fuzzy search..." aria-label="Search notes"><div class="toolbar"><button id="new">+ NEW NOTE</button><button id="exportAll">EXPORT ALL</button></div><p class="status" id="count"></p><div id="notes"></div></aside><section><input id="title" placeholder="Untitled note" aria-label="Note title"><div class="toolbar"><button id="bullet">• BULLET</button><button id="table">▦ TABLE</button><button id="duplicate">DUPLICATE</button><button id="export">EXPORT TXT</button><button id="delete">DELETE</button></div><textarea id="body" placeholder="> Start typing..." aria-label="Note content"></textarea><div class="status" id="status">Stored locally on this device</div></section></main>
<script>
const $=id=>document.getElementById(id),key='terminal-notes-v1';let notes=[],selected=null;
try{notes=JSON.parse(localStorage.getItem(key)||'[]')}catch{}
function persist(){localStorage.setItem(key,JSON.stringify(notes));$('status').textContent='SAVED LOCALLY • '+new Date().toLocaleTimeString()}
function fuzzy(q,s){q=q.toLowerCase().trim();s=s.toLowerCase();if(!q)return true;if(s.includes(q))return true;let i=0;for(const c of s)if(c===q[i])i++;return i===q.length}
function current(){return notes.find(n=>n.id===selected)}
function render(){const q=$('search').value;const filtered=notes.filter(n=>fuzzy(q,n.title+' '+n.body)).sort((a,b)=>b.updated-a.updated);$('count').textContent=filtered.length+' / '+notes.length+' NOTES';$('notes').replaceChildren();for(const n of filtered){const b=document.createElement('button');b.className='note'+(n.id===selected?' active':'');b.textContent=n.title||'Untitled note';const small=document.createElement('small');small.textContent=(n.body||'').slice(0,70).replace(/\n/g,' ')||'Empty note';b.append(small);b.onclick=()=>select(n.id);$('notes').append(b)}}
function select(id){selected=id;const n=current();$('title').value=n?.title||'';$('body').value=n?.body||'';render()}
function add(){const n={id:crypto.randomUUID(),title:'',body:'',updated:Date.now()};notes.unshift(n);persist();select(n.id);$('title').focus()}
function update(){let n=current();if(!n)return;n.title=$('title').value;n.body=$('body').value;n.updated=Date.now();persist();render()}
function download(name,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function insert(text){const el=$('body'),s=el.selectionStart,e=el.selectionEnd;el.setRangeText(text,s,e,'end');el.focus();update()}
$('new').onclick=add;$('search').oninput=render;$('title').oninput=update;$('body').oninput=update;
$('bullet').onclick=()=>insert('• ');$('table').onclick=()=>{const c=Math.min(8,Math.max(1,Number(prompt('Columns (1–8)','3'))||3));const r=Math.min(20,Math.max(1,Number(prompt('Rows (1–20)','3'))||3));insert(Array.from({length:r},()=>Array(c).fill('   ').join(' | ')).join('\n'))};
$('duplicate').onclick=()=>{const n=current();if(!n)return;const copy={...n,id:crypto.randomUUID(),title:(n.title||'Untitled')+' copy',updated:Date.now()};notes.unshift(copy);persist();select(copy.id)};
$('delete').onclick=()=>{if(!current()||!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==selected);persist();select(notes[0]?.id||null)};
$('export').onclick=()=>{const n=current();if(n)download((n.title||'note').replace(/[^a-z0-9-_ ]/gi,'')+'.txt',n.title+'\n\n'+n.body)};
$('exportAll').onclick=()=>download('terminal-notes-backup.json',JSON.stringify(notes,null,2));
if(!notes.length)add();else select(notes[0].id);
</script></body></html>
